site_name: Research Progress
site_url: https://MorschTom.github.io/
repo_url: https://github.com/MorschTom/MorschTom.github.io

##############################################################
# Edit for Navigation
##############################################################
nav:
  - Home: index.md
  - Research Proposal: researchProposal.md
  #- Weekly Reports:
  #    - reports/
  # reserved for later use 
  #- Presentations: 
      #- presentation/

##############################################################
# Setting up the Webpage
##############################################################

theme:
  name: material
  language: en 

  icon: 
    logo: material/file-document
  
  palette: 
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

  features:
    - navigation.instant
    - navigation.top
    - navigation.path
    - search.highlight
    - content.code.copy

exclude_docs: |
  readme.md 

markdown_extensions:
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

  #WATCH OUT!!! This stops working in MkDocs 2 so only use MkDocs 1
plugins:
- search
- bibtex:
    bib_file: "docs/assets/bibliography/refs.bib"
    csl_file: "docs/assets/bibliography/ieee.csl"   # optional, sets the citation style
    enable_inline_citations: false